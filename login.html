<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Aurea Academy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">✦</div>
        Aurea Academy
      </a>
      <nav class="nav" id="nav">
        <a href="index.html">Início</a>
        <a href="index.html#cursos">Cursos</a>
        <span id="navAuth"></span>
      </nav>
      <button class="menu-toggle" id="menuToggle">☰</button>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">Entrar</button>
        <button type="button" class="auth-tab" data-mode="register">Criar conta</button>
      </div>

      <h1 id="authTitle">Bem-vindo de volta</h1>
      <p class="subtitle" id="authSubtitle">Entre para participar da comunidade e acompanhar seus estudos.</p>

      <div class="form-error" id="formError"></div>
      <div class="form-success" id="formSuccess"></div>

      <!-- Login form -->
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" required placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Entrar</button>
      </form>

      <!-- Register form -->
      <form id="registerForm" style="display:none;">
        <div class="form-group">
          <label for="regName">Nome</label>
          <input type="text" id="regName" required placeholder="Seu nome" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="regEmail">E-mail</label>
          <input type="email" id="regEmail" required placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="regPassword">Senha</label>
          <input type="password" id="regPassword" required placeholder="Mínimo 4 caracteres" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Criar conta</button>
      </form>

      <p class="auth-switch" id="authSwitch">
        Ainda não tem conta? <a href="#" id="switchLink">Criar conta</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('menuToggle')?.addEventListener('click', () => {
      document.getElementById('nav').classList.toggle('open');
    });

    // If already logged in, go to profile
    if (AureaAuth.isLoggedIn()) {
      window.location.href = 'perfil.html';
    }

    const params = new URLSearchParams(window.location.search);
    let mode = params.get('mode') === 'register' ? 'register' : 'login';

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const formError = document.getElementById('formError');
    const formSuccess = document.getElementById('formSuccess');
    const switchLink = document.getElementById('switchLink');
    const authSwitch = document.getElementById('authSwitch');
    const tabs = document.querySelectorAll('.auth-tab');

    function setMode(m) {
      mode = m;
      formError.classList.remove('show');
      formSuccess.classList.remove('show');
      tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === m));
      if (m === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        authTitle.textContent = 'Bem-vindo de volta';
        authSubtitle.textContent = 'Entre para participar da comunidade e acompanhar seus estudos.';
        authSwitch.innerHTML = 'Ainda não tem conta? <a href="#" id="switchLink">Criar conta</a>';
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        authTitle.textContent = 'Crie sua conta';
        authSubtitle.textContent = 'Junte-se à comunidade e peça conteúdos que você precisa.';
        authSwitch.innerHTML = 'Já tem conta? <a href="#" id="switchLink">Entrar</a>';
      }
      document.getElementById('switchLink')?.addEventListener('click', (e) => {
        e.preventDefault();
        setMode(mode === 'login' ? 'register' : 'login');
      });
    }

    tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
    setMode(mode);

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      formError.classList.remove('show');
      const result = AureaAuth.login({
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      });
      if (result.ok) {
        formSuccess.textContent = 'Login realizado! Redirecionando...';
        formSuccess.classList.add('show');
        setTimeout(() => { window.location.href = 'perfil.html'; }, 600);
      } else {
        formError.textContent = result.error;
        formError.classList.add('show');
      }
    });

    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      formError.classList.remove('show');
      const result = AureaAuth.register({
        name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value
      });
      if (result.ok) {
        formSuccess.textContent = 'Conta criada! Redirecionando...';
        formSuccess.classList.add('show');
        setTimeout(() => { window.location.href = 'perfil.html'; }, 600);
      } else {
        formError.textContent = result.error;
        formError.classList.add('show');
      }
    });
  </script>
</body>
</html>
